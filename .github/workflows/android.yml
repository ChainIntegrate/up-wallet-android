name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Web content from Cross_Chain at the pinned commit
        run: npm run web

      # Installing Chromium and its system packages once hung until the job's 30-minute limit:
      # each step has its own limit, so a hang fails early and names the step.
      - name: Install Chromium for the tests
        timeout-minutes: 10
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          npm install --no-save playwright@1.56.1

      - name: Tests (phone layout, MetaMask, native features)
        timeout-minutes: 5
        run: npm test

      - name: Copy into the Android project
        run: npx cap sync android

      # The release key comes from the repository's secrets (UPW_KEYSTORE_B64: the PKCS#12 file in
      # base64; UPW_KEYSTORE_PASSWORD). Secrets are not given to pull requests from forks: there,
      # and whenever they are missing, a debug APK is built with a throwaway key, named "-debug".
      - name: Release key
        env:
          KEY_B64: ${{ secrets.UPW_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            umask 077
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upwallet.p12"
            echo "UPW_KEYSTORE_FILE=$RUNNER_TEMP/upwallet.p12" >> "$GITHUB_ENV"
          else
            echo "No release key in the secrets: building a debug APK."
          fi

      - name: Build the APK
        working-directory: android
        env:
          UPW_KEYSTORE_PASSWORD: ${{ secrets.UPW_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$UPW_KEYSTORE_FILE" ]; then ./gradlew assembleRelease --no-daemon
          else ./gradlew assembleDebug --no-daemon; fi

      - name: Name the APK after the commit
        run: |
          if [ -n "$UPW_KEYSTORE_FILE" ]; then cp android/app/build/outputs/apk/release/app-release.apk "up-wallet-${GITHUB_SHA::7}.apk"
          else cp android/app/build/outputs/apk/debug/app-debug.apk "up-wallet-${GITHUB_SHA::7}-debug.apk"; fi

      # Which key signed the APK, in the run's annotations: the release key's certificate fingerprint
      # (public, the same in every release), or a warning for a debug APK.
      - name: Signer of the APK
        run: |
          f=$(ls up-wallet-*.apk)
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          certs=$("$signer" verify --print-certs "$f")
          fp=$(echo "$certs" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //')
          owner=$(echo "$certs" | grep -m1 'certificate DN' | sed 's/.*DN: //')
          if [ -n "$UPW_KEYSTORE_FILE" ]; then echo "::notice title=Release key::$f signed by $owner, SHA-256 $fp"
          else echo "::warning title=Debug key::$f signed by a throwaway debug key ($owner): it cannot update an installed release"; fi

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/upwallet.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: up-wallet-apk
          path: up-wallet-*.apk
          retention-days: 30
