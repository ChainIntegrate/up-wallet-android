<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- The signing window (SignerActivity): only these local files, no network, no inline script. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UP Wallet — firma / sign</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1115; color: #e6e8ec; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
  main { padding: 18px 16px 120px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #site { color: #9aa1ad; font-size: 13px; margin-bottom: 12px; overflow-wrap: anywhere; }
  .row { border-top: 1px solid #2a2f3a; padding: 9px 0; }
  .label { color: #9aa1ad; font-size: 12.5px; }
  .value { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #account { color: #9aa1ad; font-size: 12.5px; margin-top: 12px; overflow-wrap: anywhere; }
  #err { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(224,90,90,0.15); color: #ff8a8a; overflow-wrap: anywhere; }
  #actions { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #0f1115; border-top: 1px solid #2a2f3a; }
  button { flex: 1; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: #3b82f6; }
  button.secondary { background: #2a2f3a; }
  button:disabled { opacity: 0.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="site"></div>
  <div id="rows"></div>
  <div id="account"></div>
  <div id="err" hidden></div>
</main>
<div id="actions" hidden>
  <button id="cancel" type="button" class="secondary"></button>
  <button id="sign" type="button"></button>
</div>
<script src="signer.js"></script>
</body>
</html>
